# Example Azoic ExperimentConfig -- direct Tweedie GLM + GBM on the
# synthetic portfolio (driver_age / vehicle_age / region / vehicle_brand).
# From the repository root, generate the ignored input and run:
#   uv run python -c "from tests.conftest import make_synthetic_portfolio as m; m(n=20000, seed=42).to_parquet('examples/synthetic.parquet')"
#   uv run azoic fit --config examples/tweedie.yaml

name: tweedie-v1
data_path: examples/synthetic.parquet

spec:
  target: claim_amount
  exposure: exposure
  claim_count: claim_count

features:
  - driver_age
  - vehicle_age
  - region
  - vehicle_brand

split: random
test_size: 0.2
random_state: 42

models:
  tweedie-glm:
    kind: glm
    params:
      family: tweedie
      link: log
      tweedie_power: 1.5

  tweedie-gbm:
    kind: gbm
    params:
      objective: tweedie
      tweedie_variance_power: 1.5
      n_estimators: 50
      num_leaves: 15
      learning_rate: 0.05
      random_state: 42
