name: Documentation

on:
  push:
    branches: [main]

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: quarto-dev/quarto-actions/setup@v2
      - run: uv sync --locked --all-extras --all-groups
      - name: Restore tutorial data snapshot
        run: |
          snapshot="$RUNNER_TEMP/fremtpl2-openml-v1.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            --output "$snapshot" \
            https://github.com/ThomasBury/azoic/releases/download/v0.7.1/fremtpl2-openml-v1.tar.gz
          printf '%s  %s\n' 'c3da448cb7e690dbb50f47ff090c65d23c1b33dd768262d145b06130c74594de' "$snapshot" \
            | sha256sum --check --strict
          mkdir -p examples/_artifacts/fremtpl2
          tar -xzf "$snapshot" -C examples/_artifacts/fremtpl2
      - run: uv run quarto render examples/
      - run: uv run zensical build --strict
      - run: mkdir -p site/tutorial && cp -r examples/_book/. site/tutorial/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - uses: actions/deploy-pages@v5
