name: Release

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v9
      - name: Sync locked dependencies
        run: uv sync --locked --all-extras --all-groups
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run ty check
      - name: Test
        run: uv run pytest
      - name: Build documentation
        run: uv run zensical build --strict
      - name: Build distributions
        run: uv build
      - name: Smoke-test wheel
        run: uv run --isolated --no-project --with dist/*.whl azoic --help
      - name: Smoke-test source distribution
        run: uv run --isolated --no-project --with dist/*.tar.gz azoic --help
      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    environment: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v8
        with:
          name: distributions
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
