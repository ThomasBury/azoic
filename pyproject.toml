[project]
name = "riskforge"
version = "0.1.0"
description = "scikit-learn-compatible toolkit for non-life technical tariff (pure premium) modelling"
readme = "README.md"
authors = [{ name = "thomas-bury", email = "thomas.bury@yuzzu.be" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "glum>=3.0",
    "lightgbm>=4.3",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
aws = ["s3fs>=2024.6"]
mlops = ["mlflow>=2.14"]
tune = ["optuna>=3.6"]
plot = ["plotly>=5.20"]
explain = ["shap>=0.45"]

[project.scripts]
riskforge = "riskforge.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
# Typer's documented pattern uses `typer.Option(...)` / `typer.Argument(...)`
# as parameter defaults; ruff's B008 misfires on it.
[tool.ruff.lint.per-file-ignores]
"src/riskforge/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # sklearn.utils.estimator_checks.parametrize_with_checks still passes a
    # generator to pytest.parametrize (upstream, not our control).
    "ignore:Passing a non-Collection iterable to parametrize is deprecated",
]