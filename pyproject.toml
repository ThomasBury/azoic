[project]
name = "azoic"
version = "0.4.0"
description = "scikit-learn-compatible toolkit for non-life technical tariff (pure premium) modelling"
readme = "README.md"
authors = [{ name = "thomas-bury", email = "thomas.bury@yuzzu.be" }]
license = { text = "MIT" }
requires-python = ">=3.12"
urls = { Repository = "https://github.com/ThomasBury/azoic", Issues = "https://github.com/ThomasBury/azoic/issues", Documentation = "https://thomasbury.github.io/azoic/" }
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "glum>=3.0",
    "lightgbm>=4.3",
    "pyarrow>=15.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
aws = ["s3fs>=2024.6"]
mlops = ["mlflow>=2.14"]
tune = ["optuna>=3.6"]
plot = ["plotly>=6.9.0"]

[project.scripts]
azoic = "azoic.cli:app"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
demo = ["jupyter>=1.1"]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "ty>=0.0.71",
]
docs = [
    "mkdocstrings-python>=2.0.5",
    "zensical>=0.0.54",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM"]
# Typer's documented pattern uses `typer.Option(...)` / `typer.Argument(...)`
# as parameter defaults; ruff's B008 misfires on it.
[tool.ruff.lint.per-file-ignores]
"src/azoic/cli.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.src]
include = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # sklearn.utils.estimator_checks.parametrize_with_checks still passes a
    # generator to pytest.parametrize (upstream, not our control).
    "ignore:Passing a non-Collection iterable to parametrize is deprecated",
]
